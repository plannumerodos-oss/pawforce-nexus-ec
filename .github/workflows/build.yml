name: Compilar PawForce Nexus EC (Windows EXE y Android TV APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar y compilar EXE portable
        run: |
          npm install
          npm run build:win

      - name: Subir EXE de Windows
        uses: actions/upload-artifact@v4
        with:
          name: PawForce-Nexus-EC-Windows
          path: dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar proyecto Android, copiar iconos/banner TV y compilar APK
        run: |
          npm install
          npm run android:init
          mkdir -p android/app/src/main/res/drawable
          cp build/icon.png android/app/src/main/res/drawable/ic_launcher.png || true
          cp www/assets/tv-banner.png android/app/src/main/res/drawable/tv_banner.png || true
          sed -i 's/<\/manifest>/<uses-feature android:name="android.software.leanback" android:required="false" \/><uses-feature android:name="android.hardware.touchscreen" android:required="false" \/><\/manifest>/g' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK Android / Smart TV
        uses: actions/upload-artifact@v4
        with:
          name: PawForce-Nexus-EC-Android-TV
          path: android/app/build/outputs/apk/debug/app-debug.apk
